<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dado Psicomotor de Colores</title>
    <style>
        :root {
            --rojo: #ff4757;
            --azul: #2ed573; /* Nota: El usuario pidió azul para el 2, verde para el 3, amarillo para el 4 */
            --verde: #2ed573;
            --azul-real: #1e90ff;
            --amarillo: #ffa502;
            --fondo: #f7f1e3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2f3640;
        }

        .container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: all 0.3s ease;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .dado-box {
            font-size: 5rem;
            font-weight: bold;
            height: 140px;
            width: 140px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 25px;
            background: #f1f2f6;
            color: #2f3640;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, background-color 0.4s ease, color 0.4s ease;
        }

        .girando {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-5deg); }
            40% { transform: translate(1px, -1px) rotate(5deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(-2deg); }
            100% { transform: translate(1px, -2px) rotate(2deg); }
        }

        .tarjeta {
            padding: 1.5rem;
            border-radius: 15px;
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            text-align: center;
        }

        .tarjeta.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Colores dinámicos para las tarjetas */
        .bg-rojo { background-color: var(--rojo); }
        .bg-azul { background-color: var(--azul-real); }
        .bg-verde { background-color: var(--verde); }
        .bg-amarillo { background-color: var(--amarillo); color: #2f3640 !important; }
        .bg-default { background-color: #bdc3c7; }

        button {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #5b47e0;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #b2bec3;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎲 Dado Psicomotor</h1>
        <p class="subtitle">¡Gira el dado y descubre el reto del movimiento!</p>

        <div id="dado" class="dado-box">?</div>

        <div id="tarjeta" class="tarjeta bg-default">
            Presiona el botón para comenzar el juego
        </div>

        <button id="btnLanzar" onclick="lanzarDado()">¡Girar Dado!</button>
    </div>

    <script>
        const retos = {
            1: {
                numero: 1,
                colorClase: "bg-rojo",
                nombreColor: "Rojo",
                texto: "Transportar la esfera sobre la cabeza caminando de puntillas."
            },
            2: {
                numero: 2,
                colorClase: "bg-azul",
                nombreColor: "Azul",
                texto: "Transportar la esfera saltando con los pies juntos como canguros."
            },
            3: {
                numero: 3,
                colorClase: "bg-verde",
                nombreColor: "Verde",
                texto: "Transportar la esfera desplazándote en cuadrupedia."
            },
            4: {
                numero: 4,
                colorClase: "bg-amarillo",
                nombreColor: "Amarillo",
                texto: "Transportar la esfera lanzándola y atrapándola en el aire mientras avanzan."
            }
        };

        function lanzarDado() {
            const btn = document.getElementById('btnLanzar');
            const dado = document.getElementById('dado');
            const tarjeta = document.getElementById('tarjeta');

            btn.disabled = true;
            dado.classList.add('girando');
            tarjeta.classList.remove('visible');

            // Efecto visual de números cambiando rápidamente
            let contador = 0;
            const intervalo = setInterval(() => {
                let numeroAleatorioTemp = Math.floor(Math.random() * 4) + 1;
                dado.textContent = numeroAleatorioTemp;
                contador++;
                
                if (contador > 10) {
                    clearInterval(intervalo);
                    
                    // Resultado final aleatorio del 1 al 4
                    const resultadoFinal = Math.floor(Math.random() * 4) + 1;
                    const retoSeleccionado = retos[resultadoFinal];

                    // Actualizar UI con el resultado
                    dado.classList.remove('girando');
                    dado.textContent = retoSeleccionado.numero;

                    // Configurar tarjeta
                    tarjeta.className = `tarjeta ${retoSeleccionado.colorClase} visible`;
                    tarjeta.innerHTML = `<div><strong>¡Color ${retoSeleccionado.nombreColor} (${retoSeleccionado.numero})!</strong><br><br>${retoSeleccionado.texto}</div>`;

                    btn.disabled = false;
                }
            }, 80);
        }
    </script>
</body>
</html>
